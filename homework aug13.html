<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Registration Page </title>
</head>
<body>

     <h1 align="center">User Registration Page for Job </h1> <hr>

       
        <form>
            <table border="5" cellpadding="20" align="center">
                <tr> 
                    <td> Username</td> 
                    <td><input type="text" name="Username" placeholder="Enter your name"></td>
                </tr> 

                <tr> 
                    <td>Address</td> 
                    <td><textarea name="Address" rows="5" cols="20"> Enter your address </textarea></td>
                </tr>  

                <tr> 
                    <td>Date</td> 
                    <td><input type="Date" name="DOB" placeholder="DOB"></td>


                <tr>
                    <td>Gender</td>
                    <td>
                        <input type="radio" name="gender" value="male">Male 
                        <input type="radio" name="gender" value="female"> Female 
                        <input type="radio" name="gender" value="other"> Other
                    </td>
                </tr>  

                <tr>
                    <td>Email</td> 
                    <td><input type="text" name="Email" placeholder="Enter your email"></td>
                </tr>

                <tr>
                    <td>Skills</td> 
                    <td>
                       Python: <input type="checkbox" name="python" > 
                        Html: <input type="checkbox" name="html" >
                          DA: <input type="checkbox" name="da" > 
                         DS: <input type="checkbox" name="ds" >
                    </td>
                </tr>    

                <tr>
                    <td>Qualification</td> 
                    <td>
                        <select name=" Qualification">
                       <option>Select Qualification</option>
                        <option > B.tech</option>
                        <option> B.E </option>
                        <option> BCA </option> 
                        <option> MCA </option> 
                        <option> M.Tech</option>
                    </select>
                    </td>
                </tr>

                <tr>
                   <td> Country</td>
                   <td>
                    <select name="country"> 
                        <option>Select Country</option>
                    <option value="India">India</option>
                    <option value="US">Us</option>
                    <option value="UK">Uk</option> 
                    <option value="Japan">Japan</option>
             </select> 
                   </td>
                </tr> 

                <tr>
                    <td colspan="2" align="center">
                        <input type="submit" value="Register">
                    </td>
                </tr
             </table>
        </form> 
    
</body>
</html>
